<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>敗血性休克模擬訓練 | Bed 4 ICU</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #070b0a;
    --panel: #0d1512;
    --panel-2: #0f1a16;
    --grid: rgba(0,255,157,0.055);
    --line: rgba(150,255,220,0.12);
    --green: #00ff9d;
    --green-dim: #0a6b4c;
    --cyan: #5fe0e8;
    --amber: #ffb020;
    --red: #ff4d5e;
    --text: #dfeae6;
    --text-dim: #6f8b83;
    --mono: 'JetBrains Mono', monospace;
    --sans: 'Noto Sans TC', sans-serif;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--text);font-family:var(--sans);}
  body{
    min-height:100vh;
    background-image:
      linear-gradient(var(--grid) 1px, transparent 1px),
      linear-gradient(90deg, var(--grid) 1px, transparent 1px);
    background-size: 28px 28px;
    padding: 18px;
  }
  .frame{
    max-width: 920px;
    margin: 0 auto;
    border: 1px solid var(--line);
    border-radius: 10px;
    background: linear-gradient(180deg, var(--panel), var(--bg));
    box-shadow: 0 0 0 1px rgba(0,0,0,0.4), 0 30px 80px -30px rgba(0,255,157,0.08);
    overflow: hidden;
  }

  /* ---- top monitor bar ---- */
  .topbar{
    display:flex;
    justify-content:space-between;
    align-items:stretch;
    border-bottom:1px solid var(--line);
    background: #06100c;
  }
  .patient-id{
    padding: 14px 18px;
    border-right: 1px solid var(--line);
    flex: 1 1 auto;
    min-width: 180px;
  }
  .patient-id .name{font-family:var(--mono); font-size:15px; letter-spacing:0.5px; color:var(--text);}
  .patient-id .meta{font-family:var(--mono); font-size:11px; color:var(--text-dim); margin-top:4px; line-height:1.6;}
  .vitals{
    display:grid;
    grid-template-columns: repeat(5, 1fr);
    flex: 2 1 auto;
  }
  .vital{
    padding: 10px 8px;
    text-align:center;
    border-right: 1px solid var(--line);
    position:relative;
  }
  .vital:last-child{border-right:none;}
  .vital .label{font-family:var(--mono); font-size:9px; color:var(--text-dim); letter-spacing:1px;}
  .vital .val{font-family:var(--mono); font-weight:700; font-size:19px; margin-top:2px;}
  .vital.hr .val{color:var(--green);}
  .vital.bp .val{color:var(--amber);}
  .vital.spo2 .val{color:var(--cyan);}
  .vital.rr .val{color:var(--cyan);}
  .vital.temp .val{color:var(--amber);}
  .vital.critical .val{color:var(--red);}

  /* ---- ECG strip ---- */
  .ecg-wrap{
    height: 64px;
    border-bottom: 1px solid var(--line);
    background: #050908;
    position: relative;
    overflow: hidden;
  }
  .ecg-wrap svg{position:absolute; top:0; left:0; height:100%; width:200%;}
  .ecg-line{
    fill:none;
    stroke: var(--green);
    stroke-width: 1.6;
    filter: drop-shadow(0 0 4px rgba(0,255,157,0.55));
    animation: scroll 3.2s linear infinite;
  }
  .ecg-wrap.flat .ecg-line{ stroke: var(--red); animation-duration: 6s; opacity:0.9;}
  .ecg-wrap.calm .ecg-line{ animation-duration: 4.4s;}
  @keyframes scroll{
    from{ transform: translateX(0); }
    to{ transform: translateX(-50%); }
  }

  /* ---- progress track ---- */
  .progress{
    display:flex;
    padding: 12px 18px;
    gap: 6px;
    border-bottom: 1px solid var(--line);
    background: var(--panel-2);
  }
  .dot-step{
    flex:1;
    text-align:center;
  }
  .dot-step .dot{
    width:9px; height:9px; border-radius:50%;
    background: #1c2b26;
    border: 1px solid var(--line);
    margin: 0 auto 6px;
  }
  .dot-step.done .dot{ background: var(--green); box-shadow:0 0 6px var(--green);}
  .dot-step.active .dot{ background: var(--amber); box-shadow:0 0 8px var(--amber);}
  .dot-step .lbl{font-family:var(--mono); font-size:9.5px; color:var(--text-dim); letter-spacing:0.3px;}
  .dot-step.active .lbl{color:var(--amber);}
  .dot-step.done .lbl{color:var(--green);}

  /* ---- main stage ---- */
  main{ padding: 22px 22px 26px; min-height: 360px; }
  .eyebrow{
    font-family:var(--mono); font-size:11px; color:var(--amber);
    letter-spacing:1.5px; text-transform:uppercase; margin-bottom:8px;
  }
  h1{ font-size:20px; margin:0 0 12px; line-height:1.5; color:var(--text); font-weight:700;}
  h2{ font-size:16px; margin: 18px 0 8px; color: var(--cyan); font-weight:700;}
  p{ line-height:1.85; font-size:14.5px; color:var(--text); margin:0 0 10px;}
  .dim{ color: var(--text-dim); font-size:13px; }
  .card{
    background: rgba(255,255,255,0.02);
    border:1px solid var(--line);
    border-radius:8px;
    padding:14px 16px;
    margin: 14px 0;
  }
  table.vitalstable{ width:100%; border-collapse:collapse; font-family:var(--mono); font-size:13px; margin:10px 0;}
  table.vitalstable td, table.vitalstable th{ padding:7px 10px; border-bottom:1px solid var(--line); text-align:left;}
  table.vitalstable th{color:var(--text-dim); font-weight:500; font-size:11px; letter-spacing:0.5px;}
  table.vitalstable td.num{color:var(--amber); font-weight:700;}
  table.vitalstable td.score{color:var(--cyan); text-align:center;}

  .options{ display:flex; flex-direction:column; gap:10px; margin-top:16px;}
  .opt{
    text-align:left;
    background: rgba(255,255,255,0.015);
    border:1px solid var(--line);
    color:var(--text);
    font-family:var(--sans);
    font-size:14px;
    line-height:1.6;
    padding:12px 14px;
    border-radius:7px;
    cursor:pointer;
    transition: border-color .15s, background .15s, transform .1s;
  }
  .opt:hover{ border-color: var(--cyan); background: rgba(95,224,232,0.06); }
  .opt .tag{
    display:inline-block; font-family:var(--mono); font-size:11px; color:var(--text-dim);
    border:1px solid var(--line); border-radius:4px; padding:0 6px; margin-right:8px;
  }
  .opt.correct{ border-color: var(--green); background: rgba(0,255,157,0.08); }
  .opt.wrong{ border-color: var(--red); background: rgba(255,77,94,0.08); }
  .opt.disabled{ pointer-events:none; opacity:0.75; }
  .opt.checkbox{ display:flex; align-items:center; gap:10px;}
  .opt.checkbox .box{
    width:16px; height:16px; border:1px solid var(--line); border-radius:3px; flex:0 0 auto;
    display:flex; align-items:center; justify-content:center; font-size:11px; color:var(--green);
  }
  .opt.checkbox.selected .box{ border-color:var(--green); background:rgba(0,255,157,0.15);}

  .feedback{
    margin-top:16px; padding:14px 16px; border-radius:8px; font-size:13.5px; line-height:1.85;
    border-left:3px solid var(--green); background: rgba(0,255,157,0.05); display:none;
  }
  .feedback.show{ display:block; }
  .feedback.bad{ border-left-color: var(--red); background: rgba(255,77,94,0.05); }
  .feedback .verdict{ font-family:var(--mono); font-weight:700; letter-spacing:0.5px; margin-bottom:6px; display:block;}
  .feedback.bad .verdict{ color:var(--red); }
  .feedback:not(.bad) .verdict{ color:var(--green); }

  .actions{ margin-top:18px; display:flex; justify-content:flex-end; gap:10px;}
  button.primary{
    font-family:var(--mono); font-size:13px; letter-spacing:0.5px;
    background: var(--green); color:#04140c; border:none; border-radius:6px;
    padding:11px 20px; cursor:pointer; font-weight:700;
    box-shadow: 0 0 16px rgba(0,255,157,0.25);
    transition: transform .1s;
  }
  button.primary:hover{ transform: translateY(-1px); }
  button.primary:disabled{ opacity:0.35; cursor:not-allowed; box-shadow:none; }
  button.ghost{
    font-family:var(--mono); font-size:12px; background:transparent; color:var(--text-dim);
    border:1px solid var(--line); border-radius:6px; padding:10px 16px; cursor:pointer;
  }
  button.ghost:hover{ color: var(--cyan); border-color: var(--cyan); }

  /* ---- status footer ---- */
  footer{
    display:flex; justify-content:space-between; align-items:center;
    padding:10px 18px; border-top:1px solid var(--line); background:#06100c;
    font-family:var(--mono); font-size:11px; color:var(--text-dim);
  }
  footer .score{ color:var(--cyan); }

  /* ---- summary screen ---- */
  .bignum{ font-family:var(--mono); font-size:52px; font-weight:700; color:var(--green); line-height:1; }
  .summary-grid{ display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-top:16px;}
  .summary-item{ border:1px solid var(--line); border-radius:7px; padding:10px 12px; font-size:12.5px; }
  .summary-item b{ display:block; font-family:var(--mono); font-size:11px; color:var(--text-dim); margin-bottom:4px;}

  @media (max-width:640px){
    .vitals{ grid-template-columns: repeat(3, 1fr); }
    .patient-id{ display:none; }
    .dot-step .lbl{ display:none; }
    .summary-grid{ grid-template-columns:1fr; }
  }
</style>
</head>
<body>
<div class="frame">
  <div class="topbar">
    <div class="patient-id">
      <div class="name">張○生・57M</div>
      <div class="meta">66.8 kg｜Bed 04 ICU<br>HBV cirrhosis (Child-Pugh C)<br>HCC Stage IV on Atezo+Bev</div>
    </div>
    <div class="vitals" id="vitals"></div>
  </div>
  <div class="ecg-wrap" id="ecgWrap">
    <svg viewBox="0 0 600 60" preserveAspectRatio="none">
      <path class="ecg-line" d="M0,30 L40,30 L48,30 L54,10 L60,50 L66,30 L100,30 L108,30 L114,22 L120,30 L160,30
        L200,30 L208,30 L214,10 L220,50 L226,30 L260,30 L268,30 L274,22 L280,30 L320,30
        L360,30 L368,30 L374,10 L380,50 L386,30 L420,30 L428,30 L434,22 L440,30 L480,30
        L520,30 L528,30 L534,10 L540,50 L546,30 L580,30 L588,30 L594,22 L600,30
        M600,30 L640,30 L648,30 L654,10 L660,50 L666,30 L700,30 L708,30 L714,22 L720,30 L760,30
        L800,30 L808,30 L814,10 L820,50 L826,30 L860,30 L868,30 L874,22 L880,30 L920,30
        L960,30 L968,30 L974,10 L980,50 L986,30 L1020,30 L1028,30 L1034,22 L1040,30 L1080,30
        L1120,30 L1128,30 L1134,10 L1140,50 L1146,30 L1180,30 L1188,30 L1194,22 L1200,30"/>
    </svg>
  </div>
  <div class="progress" id="progress"></div>
  <main id="stage"></main>
  <footer>
    <span>敗血性休克照護路徑模擬 · SSC 2026</span>
    <span class="score" id="scoreLabel">SCORE 0/0</span>
  </footer>
</div>

<script>
/* ===================== 資料設定 ===================== */
const STAGE_LABELS = ["辨識 NEWS2","第一小時集束","抗生素選擇","降階決策","升壓劑 / 器官支持","不良反應辨識"];

// screen -> which progress-dot index it lights up (0-based), or -1 for intro/summary
const SCREEN_DOT = { intro:-1, s1:0, s2:1, s3:2, s3b:3, s4:4, epi:5, summary:-1 };

let vitalsProfile = "critical"; // critical | resuscitating | stable
let score = 0, total = 0;
let screenOrder = ["intro","s1","s2","s3","s3b","s4","epi","summary"];
let screenIdx = 0;
let history = {}; // record answered state per screen id

/* ===================== 生命徵象模擬 ===================== */
function vitalSet(profile){
  if(profile==="critical") return {hr:128, bp:"82/48", spo2:90, rr:26, temp:38.9, crit:true};
  if(profile==="resuscitating") return {hr:112, bp:"92/56", spo2:94, rr:22, temp:38.4, crit:true};
  if(profile==="onPressor") return {hr:98, bp:"105/64", spo2:96, rr:20, temp:38.0, crit:false};
  return {hr:88, bp:"118/70", spo2:97, rr:18, temp:37.4, crit:false};
}
function renderVitals(){
  const v = vitalSet(vitalsProfile);
  const jitter = n => n + (Math.random()<0.5?-1:1)*Math.round(Math.random());
  document.getElementById("vitals").innerHTML = `
    <div class="vital hr ${v.crit?'critical':''}"><div class="label">HR bpm</div><div class="val">${jitter(v.hr)}</div></div>
    <div class="vital bp ${v.crit?'critical':''}"><div class="label">NIBP mmHg</div><div class="val">${v.bp}</div></div>
    <div class="vital spo2"><div class="label">SpO2 %</div><div class="val">${v.spo2}</div></div>
    <div class="vital rr"><div class="label">RR /min</div><div class="val">${jitter(v.rr)}</div></div>
    <div class="vital temp"><div class="label">TEMP °C</div><div class="val">${v.temp}</div></div>
  `;
  const ecg = document.getElementById("ecgWrap");
  ecg.classList.toggle("calm", !v.crit);
}
setInterval(renderVitals, 1800);

function flashECG(bad){
  const ecg = document.getElementById("ecgWrap");
  ecg.classList.toggle("flat", bad);
  if(bad) setTimeout(()=>ecg.classList.remove("flat"), 1400);
}

/* ===================== 進度條 ===================== */
function renderProgress(){
  const dotIdx = SCREEN_DOT[screenOrder[screenIdx]];
  let html = "";
  STAGE_LABELS.forEach((lbl,i)=>{
    let cls = "";
    if(dotIdx===i) cls="active";
    else if(dotIdx>i || dotIdx===-1 && i < 6 && history["done_"+i]) cls="done";
    if(dotIdx!==-1 && i < dotIdx) cls="done";
    html += `<div class="dot-step ${cls}"><div class="dot"></div><div class="lbl">${lbl}</div></div>`;
  });
  document.getElementById("progress").innerHTML = html;
}

function updateScoreLabel(){
  document.getElementById("scoreLabel").textContent = `SCORE ${score}/${total}`;
}

/* ===================== 畫面渲染 ===================== */
function goTo(id){
  screenIdx = screenOrder.indexOf(id);
  render();
}
function next(){
  screenIdx++;
  render();
}

function render(){
  const id = screenOrder[screenIdx];
  renderProgress();
  const el = document.getElementById("stage");
  el.innerHTML = "";
  SCREENS[id]();
  window.scrollTo({top:0, behavior:"smooth"});
}

function mkFeedback(container, isGood, title, body){
  const fb = document.createElement("div");
  fb.className = "feedback show" + (isGood? "" : " bad");
  fb.innerHTML = `<span class="verdict">${title}</span>${body}`;
  container.appendChild(fb);
  flashECG(!isGood);
}

function mkNextButton(container, label, onClick){
  const wrap = document.createElement("div");
  wrap.className = "actions";
  const btn = document.createElement("button");
  btn.className = "primary";
  btn.textContent = label || "繼續 →";
  btn.onclick = onClick || next;
  wrap.appendChild(btn);
  container.appendChild(wrap);
}

/* ===================== 各關卡內容 ===================== */
const SCREENS = {};

SCREENS.intro = function(){
  const el = document.getElementById("stage");
  el.innerHTML = `
    <div class="eyebrow">CASE SIMULATION · 敗血性休克照護路徑</div>
    <h1>張○生，57 歲男性。因「嘔吐含黃色分泌物 1 天」至急診求診，
    放置鼻胃管時引流出咖啡色物質，隨即發生院內心跳停止（IHCA）。</h1>
    <div class="card">
      <p><b>過去病史：</b>B 型肝炎合併肝硬化（Child-Pugh C，具黃疸與低白蛋白血症）；
      肝細胞癌 Stage IV，正接受 Atezolizumab + Bevacizumab；高血壓；
      食道與十二指腸潰瘍。</p>
      <p><b>現況：</b>CPR 11 分鐘後 ROSC，已插管接呼吸器，ROSC 後呈現持續性低血壓。</p>
    </div>
    <p class="dim">你是值班藥師 / PGY，將依序做出五個關鍵臨床決策。每一步都會影響病患的監測波形與最終結案分數。</p>
  `;
  mkNextButton(el, "接手病患 →");
};

/* ---- Stage 1: NEWS2 辨識（取代 SOFA 作為第一線篩檢工具，依 2026 指引更新）---- */
SCREENS.s1 = function(){
  const el = document.getElementById("stage");
  el.innerHTML = `
    <div class="eyebrow">STAGE 1 · 早期辨識</div>
    <h1>急診檢傷生命徵象如下。依 2026 年更新之敗血症照護路徑，第一線床邊篩檢已改採 NEWS2（不再單獨依賴 SOFA）。</h1>
    <table class="vitalstable">
      <tr><th>參數</th><th>數值</th><th>NEWS2 分項</th></tr>
      <tr><td>呼吸速率</td><td class="num">26 /min</td><td class="score">3</td></tr>
      <tr><td>SpO2（使用氧氣）</td><td class="num">90%</td><td class="score">3</td></tr>
      <tr><td>是否使用氧氣</td><td class="num">是</td><td class="score">2</td></tr>
      <tr><td>體溫</td><td class="num">38.9°C</td><td class="score">1</td></tr>
      <tr><td>收縮壓</td><td class="num">82 mmHg</td><td class="score">3</td></tr>
      <tr><td>心跳速率</td><td class="num">128 /min</td><td class="score">3</td></tr>
      <tr><td>意識狀態</td><td class="num">新發意識混亂</td><td class="score">3</td></tr>
      <tr><td colspan="2" style="text-align:right; color:var(--text-dim);">總分</td><td class="score" style="font-weight:700;">18</td></tr>
    </table>
    <p>此病患 NEWS2 = 18 分。下一步該如何處置？</p>
    <div class="options" id="opts"></div>
  `;
  const opts = [
    {t:"NEWS2 屬中低分，先持續常規觀察即可，暫不需啟動特殊路徑。", ok:false,
     fb:"NEWS2 ≥7 分即屬高風險。18 分屬極高風險，觀察等待會延誤敗血症急救的黃金時間，錯誤處置。"},
    {t:"NEWS2 ≥7 分，屬高風險，應立即啟動敗血症照護路徑（Sepsis Pathway），同步通知團隊並準備 Hour-1 Bundle。", ok:true,
     fb:"正確。2026 更新之照護路徑以 NEWS2 作為床邊快速篩檢工具，NEWS2 ≥7 分即代表高風險，須立即啟動敗血症路徑；SOFA 則保留用於 ICU 內部器官衰竭嚴重度的持續追蹤，而非第一線篩檢。"},
    {t:"NEWS2 必須合併 SOFA 分數計算才能判讀，應先等待實驗室數據回覆再行動。", ok:false,
     fb:"NEWS2 的設計目的就是不需等待抽血結果即可床邊快速評估；等待 SOFA/實驗室數據才行動會延誤敗血症的及時處置。"},
    {t:"生命徵象受心跳停止影響會失真，在此情境下不具參考價值。", ok:false,
     fb:"生命徵象異常（低血壓、心搏過速、意識改變、發燒）正是驅動敗血症懷疑與啟動路徑的關鍵依據，仍應立即採用。"}
  ];
  renderOptionsSingle(opts, "s1");
};

/* ---- Stage 2: Hour-1 Bundle（複選） ---- */
SCREENS.s2 = function(){
  const el = document.getElementById("stage");
  el.innerHTML = `
    <div class="eyebrow">STAGE 2 · 第一小時集束治療</div>
    <h1>敗血症路徑已啟動。依 SSC Hour-1 Bundle，請勾選「應於 1 小時內完成」的處置（可複選）。</h1>
    <div class="options" id="opts"></div>
  `;
  const items = [
    {t:"測量血中 Lactate", ok:true},
    {t:"於給抗生素『前』抽取血液（含導管血）培養", ok:true},
    {t:"1 小時內給予經驗性廣效抗生素", ok:true},
    {t:"若低血壓或 Lactate ≥4 mmol/L，給予 30 mL/kg 晶體液輸液復甦", ok:true},
    {t:"輸液後仍低血壓（MAP<65 mmHg），啟動升壓劑", ok:true},
    {t:"先安排腹部電腦斷層確認感染源，確診後才給抗生素", ok:false},
    {t:"等待血液培養結果出爐再決定是否給抗生素", ok:false},
    {t:"立即開始全靜脈營養（TPN）", ok:false},
  ];
  const wrap = document.getElementById("opts");
  const selected = new Set();
  items.forEach((it, i)=>{
    const d = document.createElement("div");
    d.className = "opt checkbox";
    d.innerHTML = `<div class="box"></div><div>${it.t}</div>`;
    d.onclick = ()=>{
      if(selected.has(i)){ selected.delete(i); d.classList.remove("selected"); }
      else { selected.add(i); d.classList.add("selected"); }
    };
    wrap.appendChild(d);
  });
  mkNextButton(el, "確認集束治療 →", ()=>{
    let correct = 0, wrongPicked = 0;
    items.forEach((it,i)=>{
      const isSel = selected.has(i);
      if(it.ok && isSel) correct++;
      if(!it.ok && isSel) wrongPicked++;
    });
    const goodOk = correct === items.filter(x=>x.ok).length && wrongPicked === 0;
    document.querySelectorAll("#opts .opt").forEach((d,i)=>{
      d.classList.add("disabled");
      if(items[i].ok) d.classList.add("correct");
      else if(selected.has(i)) d.classList.add("wrong");
    });
    total++; if(goodOk) score++;
    updateScoreLabel();
    vitalsProfile = goodOk ? "resuscitating" : "critical";
    const el2 = document.getElementById("stage");
    document.querySelector("#stage .actions").remove();
    mkFeedback(el2, goodOk, goodOk? "集束治療完整正確" : "集束治療不完整或包含延誤處置",
      `SSC Hour-1 Bundle 的五個核心動作為：<b>測乳酸、抗生素前留血液培養、1 小時內給廣效抗生素、依指標給予輸液、必要時同步升壓劑</b>。
      影像學檢查與等待培養結果都不應延誤抗生素給予；敗血性休克每延遲 1 小時給抗生素，死亡率即上升。`);
    mkNextButton(el2, "進入抗生素選擇 →");
  });
};

/* ---- Epilogue: ADR 辨識 ---- */
SCREENS.epi = function(){
  const el = document.getElementById("stage");
  el.innerHTML = `

    <div class="options" id="opts"></div>
  `;
  const opts = [
    {t:"這是病患本身凝血功能異常（DIC）造成的皮下瘀斑，與用藥無關，可繼續原方案。", ok:false,
     fb:"瘀斑（ecchymosis）多呈片狀瘀青、不會形成水泡；此病患表現為全身『水泡合併大面積紅疹』，臨床型態與 DIC 造成的皮下出血不同，須提高警覺是否為藥物引起的嚴重皮膚反應。"},
    {t:"Lansoprazole 與 Meropenem 皆為近期使用且皆有 SJS/TEN 風險的可疑藥物，應同步評估兩者的因果關聯性（如給藥時序、文獻風險等級），並優先停用嫌疑最高者、視情況考慮兩者皆停用或轉換替代藥物，同時衛教病患與家屬未來避免同類藥物。", ok:true,
     fb:"正確。Lansoprazole 與 Meropenem 皆屬病患近期使用且皆有引起 SJS/TEN 的文獻報告，無法單憑時序完全排除任一藥物。臨床上會依風險等級、給藥時序與可替代性綜合判斷，此案例中團隊研判 Lansoprazole 風險相對較高而優先停用並轉換為 Famotidine；但 Meropenem 仍應持續密切監測皮膚反應，若病灶持續惡化則需一併重新評估抗生素方案。嚴重皮膚不良反應（SCAR）的原則是：懷疑即停用可疑藥物、轉換替代治療、記錄與衛教避免再暴露。"},
    {t:"先觀察兩天再決定是否停藥，以免影響治療效果。", ok:false,

  ];
  renderOptionsSingle(opts, "epi", ()=>{ vitalsProfile="stable"; next(); });
};

/* ---- Summary ---- */
SCREENS.summary = function(){
  const el = document.getElementById("stage");
  const pct = total? Math.round(score/total*100) : 0;
  let verdict = "初步掌握敗血性休克照護路徑，建議複習抗生素選擇邏輯。";
  if(pct>=85) verdict = "臨床決策掌握度高，敗血性休克 Hour-1 Bundle 與抗生素選擇邏輯清楚。";
  else if(pct>=60) verdict = "整體方向正確，部分關鍵決策（如抗生素選擇／降階邏輯）建議再強化。";
  el.innerHTML = `
    <div class="eyebrow">案例結案 · DEBRIEF</div>
    <h1>感謝您的協助！病患暫時脫離危險，等待病況穩定再進行後續治療。</h1>
    <div class="bignum">${score}<span style="font-size:22px;color:var(--text-dim);"> / ${total}</span></div>
    <p class="dim">正確決策率 ${pct}%</p>
    <div class="card"><p>${verdict}</p></div>
    <div class="summary-grid">
      <div class="summary-item"><b>核心觀念 1</b>NEWS2 ≥7 分即應立即啟動敗血症照護路徑，不需等待 SOFA 或實驗室數據。</div>
      <div class="summary-item"><b>核心觀念 2</b>Hour-1 Bundle：測乳酸、培養前給藥前抽血、1 小時內抗生素、依指標輸液、必要時升壓劑。</div>
      <div class="summary-item"><b>核心觀念 3</b>多重抗藥菌高風險病患，經驗性抗生素應同時覆蓋革蘭氏陰性（含綠膿桿菌）與陽性菌，待培養結果降階。</div>
      <div class="summary-item"><b>核心觀念 4</b>Norepinephrine 為第一線升壓劑；肝硬化病患輸液耐受性差，需動態監測避免容積過負荷。</div>
    </div>
    <div class="actions">
      <button class="ghost" onclick="restart()">重新模擬</button>
    </div>
  `;
};

function restart(){
  score=0; total=0; vitalsProfile="critical"; history={};
  updateScoreLabel();
  goTo("intro");
}

/* ---- 共用：單選題渲染 ---- */
function renderOptionsSingle(opts, screenKey, onAfter){
  const wrap = document.getElementById("opts");
  opts.forEach((o, i)=>{
    const d = document.createElement("div");
    d.className = "opt";
    d.innerHTML = `<span class="tag">${String.fromCharCode(65+i)}</span>${o.t}`;
    d.onclick = ()=>{
      if(history["locked_"+screenKey]) return;
      history["locked_"+screenKey] = true;
      document.querySelectorAll("#opts .opt").forEach((dd, ii)=>{
        dd.classList.add("disabled");
        if(opts[ii].ok) dd.classList.add("correct");
      });
      if(!o.ok) d.classList.add("wrong");
      total++; if(o.ok) score++;
      updateScoreLabel();
      const stageEl = document.getElementById("stage");
      mkFeedback(stageEl, o.ok, o.ok ? "臨床決策正確" : "建議再確認", o.fb);
      mkNextButton(stageEl, "繼續 →", onAfter || next);
    };
    wrap.appendChild(d);
  });
}

renderVitals();
updateScoreLabel();
render();
